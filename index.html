<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ספר המתכונים שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --ink:#1E2A21; --muted:#5E6B5F;
  --olive:#4F6136; --saffron:#E4A11B; --line:#D7DDCF; --chip:#E4EAD9;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A15; --surface:#1D251E; --ink:#E9EEE3; --muted:#A3AE9F;
    --olive:#A9C17A; --saffron:#F0B53A; --line:#2E3A30; --chip:#28332A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A15; --surface:#1D251E; --ink:#E9EEE3; --muted:#A3AE9F;
  --olive:#A9C17A; --saffron:#F0B53A; --line:#2E3A30; --chip:#28332A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.6}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 64px}
h1,h2,h3{font-family:"Suez One","Frank Ruhl Libre",Georgia,serif;font-weight:400;line-height:1.15;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:4px}

/* home */
.mast{padding:24px 0 20px;border-bottom:3px solid var(--ink);margin-bottom:20px}
.mast h1{font-size:clamp(2.6rem,11vw,4.2rem)}
.mast p{margin:6px 0 0;color:var(--muted)}
.search{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:grid;grid-template-columns:1fr auto;gap:4px 16px;text-decoration:none;padding:16px 0;border-bottom:1px solid var(--line)}
.toc .t{font-family:"Suez One",Georgia,serif;font-size:1.45rem;line-height:1.2}
.toc .m{color:var(--muted);font-size:.95rem;grid-column:1}
.toc .n{grid-row:1/span 2;grid-column:2;align-self:center;color:var(--olive);font-weight:700}
.empty{color:var(--muted);padding:24px 0}

/* recipe */
.back{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--olive);font-weight:700}
.rh{margin:16px 0 8px}
.rh h2{font-size:clamp(2.2rem,9vw,3.4rem)}
.cat{display:inline-block;background:var(--saffron);color:#1E2A21;font-weight:700;border-radius:6px;padding:0 10px;margin-bottom:10px}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);margin:10px 0 0}
.facts b{color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.tags span{background:var(--chip);border-radius:6px;padding:0 10px;font-size:.9rem}
section{margin-top:34px}
section h3{font-size:1.6rem;margin-bottom:10px}
.ing{list-style:none;margin:0;padding:0}
.ing label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.ing input{width:22px;height:22px;margin-top:4px;accent-color:var(--olive);flex:none}
.ing input:checked + span{text-decoration:line-through;color:var(--muted)}
.ing .q{font-weight:700}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0}
.steps li::before{content:counter(s);font-family:"Suez One",Georgia,serif;font-size:1.7rem;line-height:1;color:var(--olive);
  width:44px;height:44px;border:2px solid var(--olive);border-radius:50%;display:grid;place-items:center}
.nut{width:100%;border-collapse:collapse;background:var(--surface);border-radius:10px;overflow:hidden}
.nut th,.nut td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
.nut thead th{font-weight:700;background:var(--chip)}
.note{background:var(--surface);border-right:4px solid var(--saffron);padding:12px 16px;border-radius:6px}
.vid{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;padding:10px 20px;border-radius:999px}
.src{color:var(--muted);font-size:.95rem;margin-top:34px;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:no-preference){ #view{animation:in .25s ease-out} @keyframes in{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<main class="wrap" id="view"></main>

<script>
/* ===== מתכונים: כל מתכון חדש נוסף כאן ===== */
const RECIPES = [
  {
    id: "onion-ring-chips",
    title: "צ’יפס טבעות בצל ופרמזן",
    subtitle: "2 מרכיבים עיקריים, בלי טיגון",
    tags: ["עתיר חלבון", "דל פחמימות", "בתנור"],
    servings: 4,
    prep: "10 דקות",
    cook: "18 דקות",
    ingredients: [
      { q: "2", t: "בצלים לבנים קטנים, פרוסים לטבעות בעובי כחצי ס״מ" },
      { q: "200 גרם", t: "פרמזן מגורד (7 אונקיות)" },
      { q: "½ כף", t: "שמן זית" },
      { q: "", t: "מלח, אבקת שום ופפריקה – לפי הטעם" }
    ],
    steps: [
      "מחממים תנור ל-200°C ומרפדים תבנית שטוחה עם שוליים (כ-30×43 ס״מ) בנייר אפייה. לא נייר כסף ולא נייר שעווה – הם נדבקים.",
      "מפזרים את הפרמזן בשכבה דקה ואחידה על כל התבנית.",
      "מניחים את טבעות הבצל על הגבינה, צמודות אחת לשנייה אבל לא חופפות.",
      "מברישים קלות את החלק העליון בשמן זית ומתבלים במלח, אבקת שום ופפריקה.",
      "אופים 18 דקות, עד שהגבינה מזהיבה.",
      "מצננים 5–10 דקות, שוברים לחתיכות ומגישים."
    ],
    nutrition: { total: [940, 77, 20, 61] },
    note: "הגבינה מתקשה תוך כדי הצינון – לא לשבור מוקדם מדי.",
    source: "Josh New (דיאטן קליני) בטיקטוק · יוצר מקורי: ‎@Hungry.happens",
    video: "https://vt.tiktok.com/ZSp2CEGMU/"
  }
];
/* ========================================== */

const view = document.getElementById("view");
let filter = "הכול", query = "";

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function home(){
  const list = RECIPES.filter(r =>
    (!query || (r.title+r.tags.join(" ")+r.ingredients.map(i=>i.t).join(" ")).includes(query)));
  view.innerHTML = `
    <header class="mast"><h1>ספר המתכונים שלי</h1>
      <p>${RECIPES.length} ${RECIPES.length===1?"מתכון":"מתכונים"} שנאספו מהרשת</p></header>
    <input class="search" type="search" placeholder="חיפוש לפי שם או מרכיב…" value="${esc(query)}" aria-label="חיפוש מתכון">
    ${list.length ? `<ol class="toc">${list.map((r,i)=>`
      <li><a href="#${r.id}"><span class="t">${esc(r.title)}</span>
        <span class="m">${esc(r.subtitle||"")}</span>
        <span class="n">${RECIPES.indexOf(r)+1}</span></a></li>`).join("")}</ol>`
      : `<p class="empty">לא נמצא מתכון. נסו מילה אחרת.</p>`}`;
  const s = view.querySelector(".search");
  s.addEventListener("input", e=>{query=e.target.value.trim(); home(); const n=view.querySelector(".search"); n.focus(); n.setSelectionRange(n.value.length,n.value.length);});
}

function recipe(r){
  const key = "checked-"+r.id;
  let checked = []; try{ checked = JSON.parse(localStorage.getItem(key)||"[]"); }catch(e){}
  const [cal,p,c,f] = r.nutrition.total, n=r.servings, per=x=>Math.round(x/n);
  view.innerHTML = `
    <button class="back">→ לכל המתכונים</button>
    <header class="rh"><h2>${esc(r.title)}</h2>
      <div class="facts"><span><b>${n}</b> מנות</span><span>הכנה <b>${esc(r.prep)}</b></span><span>אפייה <b>${esc(r.cook)}</b></span></div>
      <div class="tags">${r.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      ${r.video?`<a class="vid" href="${esc(r.video)}" target="_blank" rel="noopener">▶ לצפייה בסרטון בטיקטוק</a>`:""}</header>
    <section><h3>מרכיבים</h3><ul class="ing">${r.ingredients.map((g,i)=>`
      <li><label><input type="checkbox" data-i="${i}" ${checked.includes(i)?"checked":""}>
      <span>${g.q?`<span class="q">${esc(g.q)}</span> `:""}${esc(g.t)}</span></label></li>`).join("")}</ul></section>
    <section><h3>אופן ההכנה</h3><ol class="steps">${r.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol></section>
    ${r.note?`<section><p class="note">${esc(r.note)}</p></section>`:""}
    <section><h3>ערכים תזונתיים</h3><div style="overflow-x:auto"><table class="nut">
      <thead><tr><th></th><th>קלוריות</th><th>חלבון</th><th>פחמימות</th><th>שומן</th></tr></thead>
      <tbody><tr><th>מנה</th><td>${per(cal)}</td><td>${per(p)} ג׳</td><td>${per(c)} ג׳</td><td>${per(f)} ג׳</td></tr>
      <tr><th>כל המתכון</th><td>${cal}</td><td>${p} ג׳</td><td>${c} ג׳</td><td>${f} ג׳</td></tr></tbody></table></div></section>
    <p class="src">מקור: ${esc(r.source)}</p>`;
  view.querySelector(".back").onclick=()=>{location.hash="";};
  view.querySelectorAll(".ing input").forEach(cb=>cb.onchange=()=>{
    const i=+cb.dataset.i; checked = cb.checked ? [...checked,i] : checked.filter(x=>x!==i);
    try{ localStorage.setItem(key, JSON.stringify(checked)); }catch(e){}
  });
  window.scrollTo(0,0);
}

function route(){
  const id = location.hash.slice(1);
  const r = RECIPES.find(x=>x.id===id);
  r ? recipe(r) : home();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
